<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#0f1f45;--mute:#5a6785;--line:#d9dfee;--g:#17306f;--gl:#e4eafa;--am:#a86a00;--al:#fff0cc;--red:#b3402a;--rl:#f7dcd5;--bl:#e1e9fb;--bt:#2a4fa0;--gr:#e9ecf4;--on:#fff;--gold:#fdb022;--ok:#1f7a4d;--okl:#dcf3e6}
@media(prefers-color-scheme:dark){:root{--bg:#0a1226;--card:#111c3a;--ink:#e8edf9;--mute:#98a6c6;--line:#243258;--g:#9db8ff;--gl:#1b2b57;--am:#f5c15a;--al:#3a2e10;--red:#f08a73;--rl:#401e17;--bl:#1a2b55;--bt:#9db8ff;--gr:#1a2442;--on:#0a1226;--gold:#fdb022;--ok:#6fd3a0;--okl:#173a2b}}
*{box-sizing:border-box}html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{padding:18px 16px 4px;max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.5px}.sub{color:var(--mute);margin:0;font-size:13px}
.who{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
main{max-width:1000px;margin:auto;padding:6px 16px 48px}
nav{display:flex;gap:4px;margin:8px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font:600 14px inherit;font-family:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--g)}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:0}
textarea{width:100%;font:13px/1.5 ui-monospace,monospace}
button.b{font:600 14px inherit;font-family:inherit;padding:7px 12px;border-radius:6px;border:1px solid var(--g);background:var(--g);color:var(--on);cursor:pointer}
button.b.alt{background:var(--card);color:var(--ink);border-color:var(--line)}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}
.hero{background:var(--g);color:var(--on);border-radius:10px;padding:16px;margin-bottom:12px}.hero p{margin:4px 0 0;opacity:.93}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.stat{padding:12px 14px;border-radius:10px;background:var(--gl)}.stat.m{background:var(--al)}.stat.b{background:var(--bl)}
.stat strong{display:block;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.cls{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.gap{margin:6px 0 6px 18px;padding:9px 12px;border-left:4px solid var(--g);background:var(--gl);border-radius:0 8px 8px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--okl);color:var(--ok)}.w{background:var(--al);color:var(--am)}.i{background:var(--bl);color:var(--bt)}.bad{background:var(--rl);color:var(--red)}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px;background:var(--gl);color:var(--g)}.msg.w{background:var(--al);color:var(--am)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-size:12px;font-weight:600}
.empty{color:var(--mute);padding:8px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{font:600 14px inherit;font-family:inherit;text-align:left;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--gr);color:var(--mute);min-height:56px}
.tile small{display:block;font-weight:400;font-size:11px;line-height:1.3}
.tile.free{background:var(--okl);color:var(--ok);border-color:var(--ok);cursor:pointer}.tile.cls2{background:var(--bl);color:var(--bt)}.tile.hold{background:var(--al);color:var(--am)}
.tile.syn{border-style:dashed}
button.b,nav button{min-height:44px}select,input:not([type=checkbox]){min-height:42px}input[type=checkbox]{width:22px;height:22px}
.tap,.tile,button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.tap{cursor:pointer}.tap:hover{border-color:var(--g)}.tap:active,.tile:active{transform:scale(.98)}
.tile{min-height:64px;cursor:pointer}h2.tap{padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;max-width:90vw;z-index:9;display:none;font-size:14px}
header{align-items:center}.brand{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink)}
.brand img{width:46px;height:46px;border-radius:10px;background:#fff;border:1px solid var(--line)}.brand b{font-size:22px;font-weight:800;letter-spacing:-.5px;display:block;line-height:1.1}.brand i{font-style:normal;color:var(--gold)}.brand small{font-size:11px;color:var(--mute)}
.top{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.top button{background:none;border:0;padding:8px 12px;border-radius:8px;font:600 14px inherit;font-family:inherit;color:var(--mute);cursor:pointer;min-height:44px}
.top button.on{color:var(--g);background:var(--gl)}.top .cta{background:var(--gold);color:#0f1f45}
button.b.gold{background:var(--gold);color:#0f1f45;border-color:var(--gold)}
.hp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;text-align:center}
.logo-big{background:#fff;border-radius:16px;padding:8px;width:100%;max-width:none;margin:0 auto 14px}.logo-big img{width:100%;height:auto;display:block;margin:auto;border-radius:10px}
.steps,.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.step,.feat .tap{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.step b{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--on);align-items:center;justify-content:center;margin-bottom:6px}
.stars{display:flex;gap:6px;flex-wrap:wrap}.star{font-size:26px;min-width:46px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;color:var(--mute)}.star.on{color:var(--gold);border-color:var(--gold)}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);margin-bottom:8px}.rev p{margin:4px 0 0}
footer{max-width:1000px;margin:0 auto;padding:6px 16px 32px;color:var(--mute);font-size:13px;text-align:center}
</style>
</head>

function pick(lab,d,a,b,prev,ig){let best=null;
 for(const r of ROOMS){if(r.lab!=lab||occ(r.n,d,a,b,ig))continue;const sc=(r.fl==prev.fl?0:10)+(r.syn?.5:0)+(r.cap-35)/100;if(!best||sc<best.sc)best={r,sc}}
 return best&&best.r}
function plan(cl){let cur=cl[0].b,prev=RM[cl[0].r];const out=[{c:cl[0],a:cl[0].a,b:cl[0].b,room:prev}];
 for(let i=1;i<cl.length;i++){const c=cl[i],sp=c.b-c.a;let hit=null;
  for(let t=cur;t<c.a&&!hit;t++){if(sp>1&&t<3&&t+sp>3)continue;if(tbusy(c.t,c.d,t,t+sp,{bt:bid,a:c.a,c:c.c}))continue;const r=pick(RM[c.r].lab,c.d,t,t+sp,prev,{bt:bid,a:c.a});if(r)hit={t,r}}
  if(hit){out.push({c,a:hit.t,b:hit.t+sp,room:hit.r,moved:1,eco:eco(hit.r,c.d,hit.t,hit.t+sp)});cur=hit.t+sp;prev=hit.r}
  else{out.push({c,a:c.a,b:c.b,room:RM[c.r]});cur=c.b;prev=RM[c.r]}}
 return out}

 <p style="font-size:17px;margin:0 0 14px">Stop waiting between lectures. ClassSync finds free rooms across campus and helps your class start earlier, with your teacher's and coordinator's approval.</p>
 <div class="row" style="justify-content:center"><button class="b gold" data-go="${t}">${U?'Open my app':'Get started'}</button><button class="b alt" data-go="about">How it works</button></div>
 ${U?'':`<p class="sub" style="margin:14px 0 6px">Or jump straight in with a demo account:</p><div class="row" style="justify-content:center">${Object.keys(ROLEN).map(r=>`<button class="b alt" data-demo="${r}">Try as ${ROLEN[r].toLowerCase()}</button>`).join('')}</div>`}</div>
 <div class="stats"><div class="stat"><strong>${nb}</strong><span>batches in the demo routine</span></div><div class="stat b"><strong>${ROOMS.length}</strong><span>rooms · 8 lecture rooms and 6 labs per floor</span></div><div class="stat m"><strong>${cl}</strong><span>weekly classes checked for clashes</span></div></div>
 <div class="card"><h2>The problem</h2><p class="sub" style="font-size:14px">A class is at 4 PM, but there is a two-hour gap before it. If a room is free earlier, the class could start earlier and save everyone's time. Students rarely know which rooms are free, and other batches may walk into the same room.</p></div>
 <h2>How it works</h2><div class="steps">${STEPS.map((x,i)=>`<div class="step"><b>${i+1}</b><br><b style="all:unset;font-weight:700">${x[0]}</b><p class="sub" style="margin:4px 0 0">${x[1]}</p></div>`).join('')}</div>
 <h2 style="margin-top:16px">What you get</h2><div class="feat">${[['Free rooms by floor','Tap any room to hold it or see who has it.'],['Back-to-back plan','A suggested earlier slot for each class.'],['Two-step approval','Teacher, then coordinator.'],['Events and CR meetings','Book a room and others see it as unavailable.'],['Admin panel','Add rooms, block rooms, manage routines.']].map(f=>`<div class="tap" role="button" tabindex="0" data-go="${t}"><b>${f[0]}</b><p class="sub" style="margin:4px 0 0">${f[1]}</p></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h2>What people say</h2>${allRev().slice(0,3).map(revCard).join('')}<button class="b alt" data-go="reviews">See all reviews</button></div>`}
function vReviews(){
 const real=S.reviews,avg=real.length?(real.reduce((t,r)=>t+r.stars,0)/real.length).toFixed(1):null;
 $('view').innerHTML=`<div class="card"><h2>Reviews</h2><p class="sub">${avg?`<b style="color:var(--gold)">★ ${avg}</b> from ${real.length} review${real.length>1?'s':''}.`:'No real reviews yet. Be the first. The cards marked Sample show how reviews will look.'}</p></div>${flash()}
 <div class="card"><h2>Write a review</h2>${U?`<div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${n<=RV.stars?'on':''}" data-s="${n}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div>
 <label style="margin-top:10px">Your review<textarea id="rt" rows="3" maxlength="300" style="font:15px inherit;font-family:inherit">${h2e(RV.text)}</textarea></label><p><button class="b gold" id="rs">Post review</button></p>`:`<p class="sub">Log in to write a review.</p><button class="b" data-go="login">Log in</button>`}</div>
 ${allRev().map(revCard).join('')}`;
 document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{RV.stars=+x.dataset.s;draw()});
 if(U){$('rt').oninput=e=>RV.text=e.target.value;$('rs').onclick=()=>{if(RV.text.trim().length<5){msg='Write at least a few words.';return draw()}
  S.reviews.push({id:S.n++,name:U.name||ROLEN[U.role],role:ROLEN[U.role],stars:RV.stars,text:RV.text.trim().slice(0,300)});save();RV={stars:5,text:''};msg='Thank you for your review.';draw()}}}
function vAbout(){
 $('view').innerHTML=`<div class="hp" style="text-align:left"><h2>About ClassSync</h2><p>ClassSync helps university students finish their classes back-to-back instead of waiting for hours between lectures. It shows which rooms are free right now, lets a batch hold a room, and sends a shift request to the teacher and the department coordinator for approval.</p></div>
 <div class="card"><h2>How it works</h2><div class="steps">${STEPS.map((x,i)=>`<div class="step"><b>${i+1}</b><br><b style="all:unset;font-weight:700">${x[0]}</b><p class="sub" style="margin:4px 0 0">${x[1]}</p></div>`).join('')}</div></div>
 <div class="card"><h2>Who uses it</h2><p class="sub" style="font-size:14px"><b>Students</b> see gaps, find rooms, request shifts and book events. <b>Teachers</b> approve shifts for their own classes. <b>Coordinators</b> give final permission. <b>Admins</b> manage rooms, unavailable rooms and routines.</p></div>
 <div class="card"><h2>Why it matters</h2><p class="sub" style="font-size:14px">Students save waiting time. Rooms are used fully and clashes between departments are avoided. Using rooms on floors that are already active means fewer lights and air conditioners switched on.</p></div>
 <div class="card"><h2>About the demo data</h2><p class="sub" style="font-size:14px">The routine comes from the CSE Day Class Routine, Fall 2026 of Uttara University (48 batches), used as an example. Rooms the routine does not use are spare placeholders. Everything you do is saved in your browser only. A launch version needs a shared server and real university logins.</p></div>
 ${TEAM.length?`<div class="card"><h2>Our team</h2>${TEAM.map(m=>`<div class="rev"><b>${h2e(m[0])}</b><p class="sub">${h2e(m[1])}</p></div>`).join('')}</div>`:''}
 <p><button class="b gold" data-go="${U?'app':'login'}">${U?'Open my app':'Get started'}</button></p>`}
function vLogin(){
 const L=LG,keys=Object.keys(R()).sort().reverse(),ts=[...new Set(Object.values(R()).flat().map(r=>r[4]))].sort();if(!L.bid)L.bid=keys[0]||'';if(!L.code)L.code=ts[0]||'';
 const f=(L.role=='student'||L.role=='cr')?`<label>Your batch<select id="lb">${keys.map(k=>`<option ${k==L.bid?'selected':''}>${k}</option>`).join('')}</select></label>`:L.role=='teacher'?`<label>Teacher code<select id="lc">${ts.map(k=>`<option ${k==L.code?'selected':''}>${k}</option>`).join('')}</select></label>`:L.role=='admin'?`<label>Admin PIN<input id="lp" type="password" value="${h2e(L.pin)}" style="width:140px"></label>`:'<p class="sub" style="margin:0">The coordinator gives final permission on shift requests.</p>';
 $('view').innerHTML=`<div class="hp" style="max-width:540px;margin:0 auto 14px;text-align:left"><h2>Log in to ClassSync</h2><p class="sub">Choose who you are.</p>
 <div class="row" style="margin:10px 0">${Object.keys(ROLEN).map(r=>`<button class="b ${L.role==r?'':'alt'}" data-lr="${r}">${ROLEN[r]}</button>`).join('')}</div>
 <div class="row"><label>Name (optional)<input id="ln" value="${h2e(L.name)}" style="width:200px"></label>${f}</div>${flash()}
 <p style="margin-top:12px"><button class="b gold" id="lg">Continue</button></p><p class="sub">Demo login: no password and no server. Admin PIN is 1234. A real launch needs university accounts.</p></div>`;
 document.querySelectorAll('[data-lr]').forEach(x=>x.onclick=()=>{L.role=x.dataset.lr;msg='';draw()});
 $('ln').oninput=e=>L.name=e.target.value;
 ['lb','lc','lp'].forEach(i=>{const e=$(i);if(e)e.oninput=e.onchange=ev=>{if(i=='lb')L.bid=ev.target.value;if(i=='lc')L.code=ev.target.value;if(i=='lp')L.pin=ev.target.value}});
 $('lg').onclick=()=>{const u={role:L.role,name:L.name.trim().slice(0,30)};
  if(L.role=='student'||L.role=='cr'){if(!L.bid){msg='No batches are loaded for this semester.';return draw()}u.bid=L.bid}
  if(L.role=='teacher')u.code=L.code;
  if(L.role=='admin'&&L.pin!='1234'){msg='Wrong PIN. The demo PIN is 1234.';return draw()}
  U=u;try{localStorage.setItem('cs_user',JSON.stringify(u))}catch(e){}applyUser();page='app';tab=ROLETABS[u.role][0];msg='';draw()}}
$('brand').onclick=()=>go('home');
applyUser();draw();
</script>

(() => {
  const cfg=window.CLASSSYNC_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR-PROJECT')||!cfg.supabaseAnonKey||cfg.supabaseAnonKey.includes('YOUR_')) {
    console.warn('ClassSync pilot: configure classsync-config.js before enabling live services.');
    return;
  }
  const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  window.classSyncSupabase=client;
  let currentRoom=null, pollHandle=null;
  const $id=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function googleLogin(){
    const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
    if(error) alert('Google sign-in could not start: '+error.message);
  }
  async function loadProfile(session){
    const {data,error}=await client.from('profiles').select('full_name,role,batch,teacher_code').eq('id',session.user.id).single();
    if(error||!data){alert('Your account profile is not ready. Ask the ClassSync pilot administrator to check Supabase profiles.');return;}
    if((data.role==='student'||data.role==='cr')&&!data.batch){alert('Your Google account is authenticated, but your batch has not been assigned. Contact the pilot administrator.');return;}
    window.__csLiveUser={id:session.user.id,email:session.user.email};
    U={role:data.role,name:data.full_name||session.user.user_metadata?.full_name||session.user.email,bid:data.batch||undefined,code:data.teacher_code||undefined};
    try{localStorage.setItem('cs_user',JSON.stringify(U));}catch(e){}
    if(typeof applyUser==='function')applyUser();
    page='app'; tab=(ROLETABS[U.role]||ROLETABS.student)[0]; msg=''; draw(); ensureChat();
  }
  function addGoogleButton(){
    const view=$id('view'); if(!view||!view.querySelector('#lg')||view.querySelector('#cs-auth-live'))return;
    const old=view.querySelector('#lg'); old.style.display='none';
    view.querySelectorAll('[data-lr]').forEach(b=>b.style.display='none');
    const roleRow=old.parentElement?.previousElementSibling;
    if(roleRow) roleRow.style.display='none';
    const demoNote=old.parentElement?.nextElementSibling;if(demoNote)demoNote.style.display='none';
    const panel=document.createElement('div');panel.id='cs-auth-live';
    panel.innerHTML='<button type="button" id="cs-google-login">Continue with Google</button><small>Real pilot sign-in. Your Google identity is handled by Google and Supabase; ClassSync does not receive your Google password.</small>';
    old.parentElement.insertAdjacentElement('afterend',panel);
    $id('cs-google-login').addEventListener('click',googleLogin);
  }
  const observer=new MutationObserver(addGoogleButton);
  observer.observe(document.body,{childList:true,subtree:true});
  addGoogleButton();
  client.auth.getSession().then(({data})=>{if(data.session)loadProfile(data.session)});
  client.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)loadProfile(session);if(event==='SIGNED_OUT'){window.__csLiveUser=null;location.reload();}});
  const logoutObserver=new MutationObserver(()=>{
    const logoutButton=document.getElementById('lo');
    if(logoutButton&&!logoutButton.dataset.liveBound){
      logoutButton.dataset.liveBound='1';
      logoutButton.onclick=async()=>{await client.auth.signOut();};
    }
  });
  logoutObserver.observe(document.body,{childList:true,subtree:true});
  function ensureChat(){
    if(!$id('cs-chat-launch')){
      const launch=document.createElement('button');launch.id='cs-chat-launch';launch.textContent='💬 Random chat';
      launch.onclick=()=>{$id('cs-random-chat').style.display='block';};
      document.body.appendChild(launch);
      const panel=document.createElement('section');panel.id='cs-random-chat';
      panel.innerHTML='<header><b>ClassSync Messenger</b><button id="cs-chat-close">×</button></header><div id="cs-chat-state">Connect with another signed-in user.</div><div id="cs-chat-messages"></div><div id="cs-chat-compose"><input id="cs-chat-input" maxlength="1000" placeholder="Write a message…"><button id="cs-chat-send">Send</button></div><div style="display:flex;gap:8px;padding:0 10px 10px"><button id="cs-chat-find">Find someone</button><button id="cs-chat-leave" style="background:#65727b">End chat</button></div>';
      document.body.appendChild(panel);
      $id('cs-chat-close').onclick=()=>panel.style.display='none';
      $id('cs-chat-find').onclick=findPartner;
      $id('cs-chat-leave').onclick=leaveChat;
      $id('cs-chat-send').onclick=sendChat;
      $id('cs-chat-input').onkeydown=e=>{if(e.key==='Enter')sendChat();};
    }
  }
  async function findPartner(){
    const state=$id('cs-chat-state');state.textContent='Looking for another available user…';
    const {data,error}=await client.rpc('find_random_chat');
    if(error){state.textContent='Chat service is not ready. Check the pilot SQL migration and permissions.';console.error(error);return;}
    const match=data?.[0];
    if(match?.matched&&match.room_id){currentRoom=match.room_id;window.__csCurrentChatRoom=currentRoom;state.textContent='Connected. Be respectful and do not share sensitive information.';await refreshMessages();startPolling();}
    else {state.textContent='You are in the waiting queue. Keep this window open; try Find someone again shortly.';currentRoom=null;}
  }
  async function refreshMessages(){
    if(!currentRoom)return;
    const {data,error}=await client.from('random_chat_messages').select('id,sender_id,body,created_at').eq('room_id',currentRoom).order('created_at',{ascending:true}).limit(100);
    if(error){console.error(error);return;}
    const box=$id('cs-chat-messages');box.innerHTML=(data||[]).map(m=>'<div class="cs-chat-msg '+(m.sender_id===window.__csLiveUser?.id?'mine':'')+'">'+esc(m.body)+'</div>').join('');
    box.scrollTop=box.scrollHeight;
  }
  function startPolling(){if(pollHandle)clearInterval(pollHandle);pollHandle=setInterval(refreshMessages,2500);}
  async function sendChat(){
    const input=$id('cs-chat-input'),body=input.value.trim();if(!body||!currentRoom)return;
    input.value='';
    const {error}=await client.from('random_chat_messages').insert({room_id:currentRoom,sender_id:window.__csLiveUser.id,body});
    if(error){$id('cs-chat-state').textContent='Message not sent. The chat may have ended.';console.error(error);return;}
    refreshMessages();
  }
  async function leaveChat(){
    if(currentRoom)await client.rpc('leave_random_chat',{p_room:currentRoom});
    currentRoom=null;window.__csCurrentChatRoom=null;if(pollHandle)clearInterval(pollHandle);
    $id('cs-chat-messages').innerHTML='';$id('cs-chat-state').textContent='Chat ended. Find someone to start another conversation.';
  }
  // AI remains optional. A failed endpoint must never block timetable, login, or messaging.
  window.classSyncAskAI=async function(message){
    try{
      const {data:{session}}=await client.auth.getSession();if(!session)throw new Error('Sign in required');
      const response=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({message})});
      if(!response.ok)throw new Error('AI unavailable');
      return await response.json();
    }catch(err){console.warn('ClassSync AI disabled for this request:',err);return {available:false,reply:'AI assistance is temporarily unavailable. Your timetable and messenger remain available.'};}
  };
})();
</script>
<script src="./pilot-live.js"></script>
<!-- Merged ER features from the second project. UI panels use the existing ClassSync styles. -->
<script src="./er-features.js"></script>
<script src="./section-office.js"></script>

</body>
</html>
